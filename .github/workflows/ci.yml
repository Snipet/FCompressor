# CI: build and test FCompressor on Apple Silicon (docs/DECISIONS.md ADR-87).
#
#   dsp     the JUCE-free DSP library and its probes (the `dsp` preset): the quick signal, about ten minutes.
#   plugin  the shipping configuration (the `lead` preset: GPU editor, Release, LTO): the AU, VST3 and Standalone, then
#           every probe through Scripts/verify.sh against the blessed goldens, exactly as the lead's gate runs it.
#
# Dependencies: Scripts/deps.sh fetches JUCE and bgfx.cmake at their pinned SHAs and builds shaderc into ~/audio/.deps,
# which is cached per pin (the key is deps.sh itself, where the pins live). FunkGui is cloned from GitHub at the tag
# cmake/FcmpDeps.cmake pins. Nothing is signed, installed or published here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dsp:
    name: DSP library
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && cmake --version | head -1 && ninja --version
      - name: Configure
        run: cmake --preset dsp
      - name: Build
        run: cmake --build --preset dsp
      - name: Verify
        run: Scripts/verify.sh build-dsp
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-results
          path: |
            build-dsp/verify-ctest.log
            build-dsp/probe-results
            build-dsp/golden-candidates
          if-no-files-found: ignore

  plugin:
    name: Plugin and all probes
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && cmake --version | head -1 && ninja --version
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/audio/.deps
          key: deps-macos-26-arm64-${{ hashFiles('Scripts/deps.sh') }}
      - name: Dependencies
        run: Scripts/deps.sh --no-pluginval
      - name: Configure
        run: cmake --preset lead
      - name: Build
        run: cmake --build --preset lead
      - name: Verify
        run: Scripts/verify.sh --integration build-lead
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-results
          path: |
            build-lead/verify-ctest.log
            build-lead/probe-results
            build-lead/golden-candidates
          if-no-files-found: ignore
